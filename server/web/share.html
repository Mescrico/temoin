<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Fichiers</title>
<style>
  :root { color-scheme: light dark; --bg:#0f1115; --card:#181b21; --fg:#ececee; --muted:#9aa0a6; --line:#2a2e36; --accent:#e5484d; --ok:#30a46c; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f4f5; --card:#fff; --fg:#16181d; --muted:#5f6368; --line:#e4e4e7; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,-apple-system,sans-serif; -webkit-text-size-adjust:100%; }
  main { max-width:560px; margin:0 auto; padding:max(20px,env(safe-area-inset-top)) 16px max(48px,env(safe-area-inset-bottom)); }
  h1 { font-size:1.35rem; margin:8px 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:14px; }
  .muted { color:var(--muted); font-size:.92rem; }
  .err { color:var(--accent); }
  .ok { color:var(--ok); font-weight:600; }
  button { display:flex; width:100%; align-items:center; justify-content:center; padding:14px 18px; border-radius:10px; border:0; font:inherit; font-weight:600; cursor:pointer; background:var(--fg); color:var(--bg); min-height:50px; }
  button.ghost { background:transparent; color:var(--fg); border:1px solid var(--line); margin-top:10px; }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin:12px 0 4px; }
  .bar i { display:block; height:100%; width:0; background:var(--ok); transition:width .15s; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<main>
  <div id="status" class="card"><p class="muted" id="status-text">…</p></div>

  <div id="intro" class="card hidden">
    <h1 id="intro-title"></h1>
    <p id="intro-count"></p>
    <p class="muted" id="intro-valid"></p>
    <p class="muted" id="intro-once"></p>
    <button id="open"></button>
  </div>

  <div id="work" class="card hidden">
    <strong id="progress-text"></strong>
    <div class="bar"><i id="bar"></i></div>
    <p class="muted" id="hint"></p>
    <button id="download" class="hidden"></button>
    <p id="done" class="hidden"></p>
    <button id="again" class="ghost hidden"></button>
  </div>
</main>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
// English by default, French for French browsers; ?lang=en|fr forces one.
const FR = (() => {
  const f = new URLSearchParams(location.search).get('lang');
  if (f === 'en' || f === 'fr') return f === 'fr';
  return (navigator.language || 'en').toLowerCase().startsWith('fr');
})();
const T = FR ? {
  loading: 'Chargement…',
  title: 'Des fichiers vous ont été envoyés',
  count: (n, s) => `${n} fichier${n > 1 ? 's' : ''} · ${s}`,
  valid: (d) => `Lien valable jusqu’au ${d}.`,
  once: 'Ce lien ne fonctionne qu’une fois : vous téléchargez un .zip avec tous les fichiers, puis le lien est désactivé. Ouvrez-le sur l’appareil où vous voulez les garder.',
  open: 'Ouvrir',
  preparing: (i, n) => `Déchiffrement ${i}/${n}…`,
  hint: 'Les fichiers sont déchiffrés sur cet appareil : le serveur n’a jamais pu les voir.',
  download: (s) => `Télécharger le zip (${s})`,
  again: 'Télécharger à nouveau',
  done: 'Zip téléchargé. Le lien est maintenant désactivé.',
  doneHint: 'Sur iPhone : app Fichiers → Téléchargements, touchez le zip pour l’ouvrir. Tant que cette page reste ouverte, vous pouvez le retélécharger.',
  windowOver: 'Délai dépassé : le lien est désactivé.',
  err: {
    no_key: 'Lien incomplet : la partie après « # » manque. Copiez le lien en entier.',
    bad_key: 'Impossible de déchiffrer : le lien a sans doute été mal copié (il doit être complet, avec la partie après « # »).',
    used: 'Ce lien a déjà été ouvert sur un autre appareil ou navigateur. Demandez un nouveau lien.',
    done: 'Ces fichiers ont déjà été téléchargés : le lien est désactivé.',
    expired: 'Ce lien a expiré. Demandez un nouveau lien.',
    revoked: 'Ce lien a été annulé.',
    not_ready: 'Les fichiers ne sont pas encore prêts. Réessayez dans quelques minutes.',
    network: 'Erreur réseau. Rechargez la page pour reprendre.',
    corrupt: 'Fichier altéré : déchiffrement refusé.',
    too_big: 'Plus de 4 Go : trop volumineux pour un seul zip. Demandez à l’organisateur de découper l’envoi.',
    unsupported: 'Ce navigateur est trop ancien pour déchiffrer les fichiers. Utilisez Safari, Chrome ou Firefox à jour.',
  },
} : {
  loading: 'Loading…',
  title: 'Files were sent to you',
  count: (n, s) => `${n} file${n > 1 ? 's' : ''} · ${s}`,
  valid: (d) => `Link valid until ${d}.`,
  once: 'This link works only once: you download a .zip with all the files, then the link is disabled. Open it on the device where you want to keep them.',
  open: 'Open',
  preparing: (i, n) => `Decrypting ${i}/${n}…`,
  hint: 'Files are decrypted on this device: the server could never see them.',
  download: (s) => `Download the zip (${s})`,
  again: 'Download again',
  done: 'Zip downloaded. The link is now disabled.',
  doneHint: 'On iPhone: Files app → Downloads, tap the zip to open it. While this page stays open you can download it again.',
  windowOver: 'Time is up: the link is disabled.',
  err: {
    no_key: 'Incomplete link: the part after “#” is missing. Copy the whole link.',
    bad_key: 'Cannot decrypt: the link was probably not copied entirely (it must include the part after “#”).',
    used: 'This link was already opened on another device or browser. Ask for a new link.',
    done: 'These files were already downloaded: the link is disabled.',
    expired: 'This link has expired. Ask for a new link.',
    revoked: 'This link was cancelled.',
    not_ready: 'The files are not ready yet. Try again in a few minutes.',
    network: 'Network error. Reload the page to resume.',
    corrupt: 'File altered: decryption refused.',
    too_big: 'Over 4 GB: too large for a single zip. Ask the organizer to split it.',
    unsupported: 'This browser is too old to decrypt the files. Use an up-to-date Safari, Chrome or Firefox.',
  },
};
document.documentElement.lang = FR ? 'fr' : 'en';

const CHUNK = 1 << 20, TAG = 16, CT = CHUNK + TAG;
const id = location.pathname.split('/')[2] || '';
const fragment = location.hash.slice(1);
const claimKey = 'sr-claim-' + id;
let key = null, claim = null, until = null, timer = null, zipUrl = null, zipName = '';

function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (_) {} }
function load(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }
function fmtBytes(n) {
  const u = FR ? ['o', 'Ko', 'Mo', 'Go'] : ['B', 'KB', 'MB', 'GB'];
  let i = 0; while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i ? n.toFixed(1) : n) + ' ' + u[i];
}
function fmtDate(s) { return new Date(s).toLocaleString(FR ? 'fr-FR' : undefined, { dateStyle: 'long', timeStyle: 'short' }); }
function status(msg, isErr) {
  $('status').classList.remove('hidden');
  $('status-text').textContent = msg;
  $('status-text').className = isErr ? 'err' : 'muted';
}
function fail(code) { status(T.err[code] || T.err.network, true); }

class HttpError extends Error { constructor(status, code) { super(code); this.status = status; this.code = code; } }
async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (claim) headers['X-SR-Claim'] = claim;
  const r = await fetch(path, { ...opts, headers, cache: 'no-store', credentials: 'omit' });
  if (!r.ok) {
    const j = await r.json().catch(() => ({}));
    throw new HttpError(r.status, j.error || (r.status === 404 ? 'revoked' : 'network'));
  }
  return r;
}

function b64urlDecode(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  return Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
}
function nonce(file, chunk, last) {
  const b = new Uint8Array(12), v = new DataView(b.buffer);
  v.setUint32(0, file); v.setUint32(4, chunk); v.setUint32(8, last ? 1 : 0);
  return b;
}

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(crc, buf) {
  crc = ~crc;
  for (let i = 0; i < buf.length; i++) crc = CRC_TABLE[(crc ^ buf[i]) & 0xff] ^ (crc >>> 8);
  return ~crc >>> 0;
}

/** Downloads file n and decrypts it chunk by chunk as it arrives. */
async function fetchFile(n, onProgress) {
  const r = await api(`/r/${id}/f/${n}`);
  const total = Number(r.headers.get('content-length')) || 0;
  let pending = [], plen = 0, got = 0, idx = 0;
  const out = [];
  const take = (len) => {
    const b = new Uint8Array(len); let o = 0;
    while (o < len) {
      const h = pending[0], k = Math.min(h.length, len - o);
      b.set(h.subarray(0, k), o); o += k;
      if (k === h.length) pending.shift(); else pending[0] = h.subarray(k);
    }
    plen -= len; return b;
  };
  const dec = async (buf, last) => {
    try { return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: nonce(n, idx++, last) }, key, buf)); }
    catch (_) { throw new HttpError(0, n === 0 ? 'bad_key' : 'corrupt'); }
  };
  const push = async (u) => {
    pending.push(u); plen += u.length; got += u.length;
    if (onProgress) onProgress(got, total);
    while (plen > CT) out.push(await dec(take(CT), false));
  };
  if (r.body && r.body.getReader) {
    const reader = r.body.getReader();
    for (;;) { const { done, value } = await reader.read(); if (done) break; await push(value); }
  } else {
    await push(new Uint8Array(await r.arrayBuffer()));
  }
  if (total && got !== total) throw new HttpError(0, 'network');
  out.push(await dec(take(plen), true));
  out.crc = out.reduce((c, b) => crc32(c, b), 0);
  return out;
}

/** A .zip (stored, no compression) built from the decrypted blobs without copying them. */
function buildZip(entries) {
  const enc = new TextEncoder(), parts = [], central = [];
  let offset = 0;
  const dos = (iso) => {
    const d = iso ? new Date(iso) : new Date();
    const valid = !isNaN(d) && d.getFullYear() >= 1980;
    const t = valid ? d : new Date(1980, 0, 1);
    return [(t.getHours() << 11) | (t.getMinutes() << 5) | (t.getSeconds() >> 1),
            ((t.getFullYear() - 1980) << 9) | ((t.getMonth() + 1) << 5) | t.getDate()];
  };
  for (const e of entries) {
    const name = enc.encode(e.name), [time, date] = dos(e.created_at);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true);
    h.setUint16(10, time, true); h.setUint16(12, date, true);
    h.setUint32(14, e.crc, true); h.setUint32(18, e.blob.size, true); h.setUint32(22, e.blob.size, true);
    h.setUint16(26, name.length, true);
    parts.push(h.buffer, name, e.blob);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
    c.setUint16(12, time, true); c.setUint16(14, date, true);
    c.setUint32(16, e.crc, true); c.setUint32(20, e.blob.size, true); c.setUint32(24, e.blob.size, true);
    c.setUint16(28, name.length, true); c.setUint32(42, offset, true);
    central.push(c.buffer, name);
    offset += 30 + name.length + e.blob.size;
  }
  const cdSize = central.reduce((a, b) => a + b.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end.buffer], { type: 'application/zip' });
}


function triggerDownload() {
  const a = document.createElement('a');
  a.href = zipUrl; a.download = zipName;
  document.body.appendChild(a); a.click(); a.remove();
}

/** One shot: open, decrypt everything, one zip, delete from the server. */
async function openShare() {
  $('intro').classList.add('hidden');
  status(T.loading);
  try {
    const r = await (await api(`/r/${id}/open`, { method: 'POST' })).json();
    claim = r.claim; until = r.until;
    store(claimKey, claim);
    const count = r.files.length - 1;
    const totalBytes = r.files.reduce((a, b) => a + b, 0);
    if (totalBytes >= 0xffffffff) throw new HttpError(0, 'too_big');
    $('status').classList.add('hidden');
    $('work').classList.remove('hidden');
    $('hint').textContent = T.hint;
    timer = setInterval(() => {
      if (until && Date.now() > new Date(until) && !zipUrl) { clearInterval(timer); store(claimKey, null); fail('expired'); $('work').classList.add('hidden'); }
    }, 30000);
    const manifest = JSON.parse(new TextDecoder().decode(await new Blob(await fetchFile(0)).arrayBuffer()));
    const entries = [];
    let doneBytes = r.files[0];
    for (let n = 1; n <= count; n++) {
      $('progress-text').textContent = T.preparing(n, count);
      const parts = await fetchFile(n, (got) => { $('bar').style.width = (100 * (doneBytes + got) / totalBytes).toFixed(1) + '%'; });
      doneBytes += r.files[n];
      const meta = manifest.files[n - 1] || { name: `file-${n}` };
      entries.push({ name: meta.name, created_at: meta.created_at, blob: new Blob(parts), crc: parts.crc });
    }
    $('bar').style.width = '100%';
    const zip = buildZip(entries);
    zipUrl = URL.createObjectURL(zip);
    zipName = 'fichiers-' + new Date().toISOString().slice(0, 10) + '.zip';
    $('progress-text').textContent = T.count(count, fmtBytes(zip.size));
    $('download').textContent = T.download(fmtBytes(zip.size));
    $('download').classList.remove('hidden');
    $('download').onclick = async () => {
      triggerDownload();
      $('download').classList.add('hidden');
      clearInterval(timer);
      try { await api(`/r/${id}/done`, { method: 'POST' }); } catch (_) {}
      store(claimKey, null);
      $('done').innerHTML = '<span class="ok"></span><br><span class="muted"></span>';
      $('done').firstChild.textContent = T.done;
      $('done').lastChild.textContent = T.doneHint;
      $('done').classList.remove('hidden');
      $('again').textContent = T.again;
      $('again').onclick = triggerDownload;
      $('again').classList.remove('hidden');
    };
  } catch (e) {
    $('work').classList.add('hidden');
    if (['used', 'done', 'expired', 'revoked'].includes(e.code)) store(claimKey, null);
    fail(e.code || 'network');
  }
}

async function start() {
  status(T.loading);
  if (!window.crypto || !crypto.subtle || !window.fetch) return fail('unsupported');
  if (!fragment) return fail('no_key');
  try {
    key = await crypto.subtle.importKey('raw', b64urlDecode(fragment), 'AES-GCM', false, ['decrypt']);
  } catch (_) { return fail('bad_key'); }
  claim = load(claimKey);
  let meta;
  try { meta = await (await api(`/r/${id}/meta`)).json(); } catch (e) { return fail(e.code || 'network'); }
  // Reload during the download: same browser resumes with its claim.
  if (meta.state === 'opened' && claim) return openShare();
  if (meta.state === 'opened') return fail('used');
  if (meta.state !== 'ready') { store(claimKey, null); return fail(meta.state); }
  // Check the key before spending the single opening: the manifest is readable unopened.
  try { await fetchFile(0); } catch (e) { return fail(e.code || 'network'); }
  $('status').classList.add('hidden');
  $('intro').classList.remove('hidden');
  $('intro-title').textContent = T.title;
  $('intro-count').textContent = T.count(meta.files, fmtBytes(meta.bytes));
  $('intro-valid').textContent = T.valid(fmtDate(meta.expires_at));
  $('intro-once').textContent = T.once;
  $('open').textContent = T.open;
  $('open').onclick = openShare;
}
start();
</script>
</body>
</html>
