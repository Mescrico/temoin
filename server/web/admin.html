<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title></title>
<style>
  :root { color-scheme: light dark; --bg:#0f1115; --card:#181b21; --fg:#e8e8ea; --muted:#9aa0a6; --line:#2a2e36; --accent:#e5484d; --ok:#30a46c; --warn:#f5a524; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f4f5; --card:#fff; --fg:#16181d; --muted:#5f6368; --line:#e4e4e7; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,sans-serif; }
  main { max-width:980px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:1.4rem; margin:0 0 16px; }
  h2 { font-size:1.1rem; margin:0 0 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; }
  .stat b { display:block; font-size:1.4rem; font-variant-numeric:tabular-nums; }
  .stat span { color:var(--muted); font-size:.85rem; }
  input, select { width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--line); background:transparent; color:inherit; font:inherit; }
  label.f { display:flex; flex-direction:column; gap:4px; font-size:.85rem; color:var(--muted); }
  button { padding:9px 14px; border-radius:8px; border:0; font:inherit; font-weight:600; cursor:pointer; background:var(--fg); color:var(--bg); white-space:nowrap; }
  button.small { padding:5px 10px; font-size:.82rem; }
  button.ghost { background:transparent; color:var(--fg); border:1px solid var(--line); }
  button.danger { background:var(--accent); color:#fff; }
  button.ok { background:var(--ok); color:#fff; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .form { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; align-items:end; }
  .qrbox { display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start; margin-top:16px; }
  .qr { background:#fff; padding:12px; border-radius:12px; width:min(320px,100%); }
  .qr svg { width:100%; height:auto; display:block; }
  .code { font:600 1.3rem ui-monospace,monospace; letter-spacing:.08em; }
  code { word-break:break-all; font-size:.78rem; color:var(--muted); }
  .muted { color:var(--muted); }
  .hidden { display:none !important; }
  .pill { padding:2px 9px; border-radius:99px; font-size:.78rem; font-weight:600; white-space:nowrap; }
  .on { background:color-mix(in srgb,var(--ok) 20%,transparent); color:var(--ok); }
  .off { background:color-mix(in srgb,var(--accent) 20%,transparent); color:var(--accent); }
  .mid { background:color-mix(in srgb,var(--muted) 20%,transparent); color:var(--muted); }
  table { width:100%; border-collapse:collapse; font-size:.85rem; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); white-space:nowrap; vertical-align:middle; }
  th { color:var(--muted); font-weight:600; }
  .scroll { overflow-x:auto; }
  .tall { max-height:480px; overflow-y:auto; }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; min-width:80px; }
  .bar i { display:block; height:100%; background:var(--ok); }
  .s2 { color:var(--ok); } .s4, .s5 { color:var(--accent); }
  a.link { color:inherit; text-decoration:underline dotted; cursor:pointer; }
</style>
</head>
<body data-stealth="{{STEALTH}}" data-name="{{NAME}}">
<main>
  <h1 id="h1"></h1>

  <div class="card" id="login">
    <p class="muted" id="login-hint"></p>
    <div class="row">
      <input id="token" type="password" autocomplete="off" placeholder="••••••••" style="flex:1;min-width:200px">
      <button id="go" data-i18n="open"></button>
    </div>
    <p id="err" class="muted"></p>
  </div>

  <div id="panel" class="hidden">
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div class="row"><span data-i18n="intake"></span> <span id="state" class="pill"></span></div>
        <button id="toggle"></button>
      </div>
      <div class="row" style="margin-top:10px"><span data-i18n="publicAddress"></span> <code id="pub-url" style="font-size:.9rem;color:inherit"></code> <span id="tun-state" class="pill hidden"></span></div>
      <p id="tun-note" class="muted hidden" style="margin:.4em 0 0"></p>
    </div>

    <div class="card grid">
      <div class="stat"><b id="s-objects">–</b><span data-i18n="statObjects"></span></div>
      <div class="stat"><b id="s-sessions">–</b><span data-i18n="statCaptures"></span></div>
      <div class="stat"><b id="s-bytes">–</b><span data-i18n="statStored"></span></div>
      <div class="stat"><b id="s-free">–</b><span data-i18n="statFree"></span></div>
      <div class="stat"><b id="s-devices">–</b><span data-i18n="statDevices"></span></div>
      <div class="stat"><b id="s-last">–</b><span data-i18n="statLast"></span></div>
    </div>

    <div class="card">
      <h2 data-i18n="inviteTitle"></h2>
      <p class="muted" style="margin-top:0" data-i18n="inviteIntro"></p>
      <div class="form">
        <label class="f"><span data-i18n="inviteName"></span><input id="i-label" data-i18n-ph="inviteNamePh"></label>
        <label class="f"><span data-i18n="validFor"></span>
          <select id="i-exp">
            <option value="6" data-i18n="h6"></option><option value="24" data-i18n="h24"></option>
            <option value="48" selected data-i18n="h48"></option><option value="168" data-i18n="d7"></option>
            <option value="720" data-i18n="d30"></option><option value="" data-i18n="unlimited"></option>
          </select>
        </label>
        <label class="f"><span data-i18n="maxPhones"></span><input id="i-max" type="number" min="1" data-i18n-ph="unlimitedPh" value="50"></label>
        <label class="f"><span data-i18n="quotaGb"></span><input id="i-quota" type="number" min="0.1" step="0.1" data-i18n-ph="serverDefault"></label>
        <button id="i-create" data-i18n="createInvite"></button>
      </div>
      <div id="i-result" class="qrbox hidden">
        <div class="qr" id="i-qr"></div>
        <div style="flex:1;min-width:220px">
          <p style="margin-top:0"><strong id="i-title"></strong></p>
          <p class="muted" data-i18n="scanHint"></p>
          <p class="code" id="i-code"></p>
          <p class="muted"><span data-i18n="serverFingerprint"></span> <strong id="fp"></strong></p>
          <code id="i-link"></code>
        </div>
      </div>
    </div>

    <div class="card">
      <h2 data-i18n="invitations"></h2>
      <div class="scroll"><table>
        <thead><tr><th data-i18n="colName"></th><th data-i18n="colStatus"></th><th data-i18n="colUses"></th><th data-i18n="colExpires"></th><th data-i18n="colQuota"></th><th></th></tr></thead>
        <tbody id="invites"></tbody>
      </table></div>
    </div>

    <div class="card">
      <h2 data-i18n="devices"></h2>
      <p class="muted" style="margin-top:0" data-i18n-html="devicesIntro"></p>
      <div class="scroll"><table>
        <thead><tr><th data-i18n="colName"></th><th data-i18n="colKey"></th><th data-i18n="colStatus"></th><th data-i18n="colUsed"></th><th data-i18n="colObjects"></th><th data-i18n="colLast"></th><th data-i18n="colInvitation"></th><th></th></tr></thead>
        <tbody id="devices"></tbody>
      </table></div>
    </div>

    <div class="card">
      <h2 data-i18n="handbackTitle"></h2>
      <p class="muted" style="margin-top:0" data-i18n-html="handbackIntro"></p>
      <div class="row" style="margin-bottom:10px">
        <input id="r-search" data-i18n-ph="codeSearchPh" autocomplete="off" style="flex:1;min-width:200px;text-transform:uppercase">
        <span id="r-found" class="muted"></span>
      </div>
      <div class="scroll"><table>
        <thead><tr><th data-i18n="colCode"></th><th data-i18n="colDevice"></th><th data-i18n="colRequested"></th><th data-i18n="colOnServer"></th><th data-i18n="colLink"></th><th></th></tr></thead>
        <tbody id="requests"></tbody>
      </table></div>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0" data-i18n="journal"></h2>
        <label class="muted"><input type="checkbox" id="onlyUploads" style="width:auto"> <span data-i18n="uploadsOnly"></span></label>
      </div>
      <p class="muted" style="margin:.25em 0 .75em" data-i18n-html="journalIntro"></p>
      <div class="scroll tall"><table>
        <thead><tr><th data-i18n="colTime"></th><th>IP</th><th data-i18n="colRequest"></th><th data-i18n="colStatus"></th><th data-i18n="colSize"></th><th data-i18n="colDevice"></th><th data-i18n="colDetail"></th></tr></thead>
        <tbody id="log"></tbody>
      </table></div>
    </div>

    <div class="card">
      <p class="muted" style="margin:0" data-i18n-html="footer"></p>
      <p class="muted" style="margin:.5em 0 0"><span data-i18n="chainHead"></span> <code id="chain"></code></p>
    </div>
  </div>
</main>
<script>
// English by default, French for French browsers; ?lang=en|fr forces one.
const LANG = (() => {
  const f = new URLSearchParams(location.search).get('lang');
  if (f === 'en' || f === 'fr') return f;
  return (navigator.language || 'en').toLowerCase().startsWith('fr') ? 'fr' : 'en';
})();
const STR = {
  en: {
    signIn: 'Sign in', accessKey: 'Access key.', adminTitle: (n) => `${n} — administration`,
    tokenHint: 'Admin token (set when the server was installed). It stays in this tab only.',
    open: 'Open', error: 'Error: ',
    intake: 'Intake:', publicAddress: 'Public address:', accepting: 'active', paused: 'paused', pause: 'Pause', resume: 'Resume intake',
    tunUp: 'tunnel up', tunStarting: 'starting…', tunDown: 'tunnel down',
    tempAddress: 'Temporary address: it changes if the server restarts. Phones then scan a new invitation (they keep their identity).',
    statObjects: 'objects received', statCaptures: 'captures', statStored: 'stored', statFree: 'free space', statDevices: 'devices', statLast: 'last upload',
    inviteTitle: 'Invite phones', inviteIntro: 'Each phone that scans an invitation gets its own key, with no name and no password. You can ban it individually.',
    inviteName: 'Invitation name', inviteNamePh: 'Saturday march', validFor: 'Valid for',
    h6: '6 hours', h24: '24 hours', h48: '48 hours', d7: '7 days', d30: '30 days', unlimited: 'no limit',
    maxPhones: 'Max phones', unlimitedPh: 'unlimited', quotaGb: 'Quota per phone (GB)', serverDefault: 'server default', createInvite: 'Create the invitation',
    scanHint: 'Have this QR code scanned in the app. Code to type by hand:', serverFingerprint: 'Server key fingerprint:',
    invitations: 'Invitations', colName: 'Name', colStatus: 'Status', colUses: 'Uses', colExpires: 'Expires', colQuota: 'Quota',
    revoked: 'revoked', active: 'active', ended: 'ended', never: 'never', revoke: 'Revoke',
    noInvites: 'No invitation yet. Create one above.',
    revokeInviteConfirm: 'Revoke this invitation? Phones already registered keep working.',
    devices: 'Devices',
    devicesIntro: 'Pseudonyms only. The “key” is the one the person sees in the app (My device screen); it also lets you give their files back by hand with <code>sr decrypt --device</code>. Click a name to rename it.',
    colKey: 'Key', colUsed: 'Used / quota', colObjects: 'Objects', colLast: 'Last upload', colInvitation: 'Invitation',
    banned: 'banned', ban: 'Ban', unban: 'Unban', noDevices: 'No device registered.',
    banConfirm: (n) => `Ban “${n}”? It will not be able to send anything.`, renamePrompt: 'New name (only visible here):',
    handbackTitle: 'Give someone their files back',
    handbackIntro: 'The person taps <strong>Get my files back</strong> in the app (Settings) and passes you the code shown, through any channel. On the computer holding the private key: <strong>Give files back</strong> in the desktop app, or <code>sr share --code CODE</code> → one-time link (and QR code) to send them through another channel. The server only receives files re-encrypted with a key it never sees.',
    codeSearchPh: 'Code received (e.g. K7F3-QX9M)',
    colCode: 'Code', colDevice: 'Device', colRequested: 'Requested', colOnServer: 'Files on the server', colLink: 'Link',
    stUploading: 'uploading', stReady: 'link ready', stOpened: 'opened', stDone: 'retrieved', stExpired: 'expired', stRevoked: 'revoked',
    waiting: 'waiting', until: 'until ', expires: 'expires ', files: (n, s) => `${n} file(s), ${s}`, objects: (n, s) => `${n} objects · ${s}`,
    cancelled: 'cancelled', unknownCode: 'unknown code', revokeLink: 'Revoke the link', cancel: 'Cancel', noRequests: 'No request yet.',
    revokeLinkConfirm: 'Revoke this link? It will stop working (nothing is deleted: the copy goes to the archive).',
    cancelConfirm: 'Cancel this request? No link can be created with this code.',
    journal: 'Journal', uploadsOnly: 'uploads only',
    journalIntro: 'Request metadata only (never the content). Full files: <code>logs/events-YYYY-MM-DD.jsonl</code>.',
    colTime: 'Time', colRequest: 'Request', colSize: 'Size', colDetail: 'Detail',
    footer: 'This server is write-only: no page lists, downloads or deletes the files received (handed-back recordings move to <code>returned/</code>, never deleted). Decryption happens offline with <code>sr decrypt</code> and the private key; only links created by <code>sr share</code> can be downloaded (once).',
    chainHead: 'Ledger chain head:',
    units: ['B', 'KB', 'MB', 'GB', 'TB'],
  },
  fr: {
    signIn: 'Connexion', accessKey: 'Identifiant d’accès.', adminTitle: (n) => `${n} — administration`,
    tokenHint: 'Jeton d’administration (défini à l’installation du serveur). Il reste dans cet onglet uniquement.',
    open: 'Ouvrir', error: 'Erreur : ',
    intake: 'Réception :', publicAddress: 'Adresse publique :', accepting: 'active', paused: 'en pause', pause: 'Mettre en pause', resume: 'Activer la réception',
    tunUp: 'tunnel actif', tunStarting: 'démarrage…', tunDown: 'tunnel coupé',
    tempAddress: 'Adresse provisoire : elle change si le serveur redémarre. Les téléphones rescannent alors une invitation (ils gardent leur identité).',
    statObjects: 'objets reçus', statCaptures: 'captures', statStored: 'stockés', statFree: 'espace libre', statDevices: 'appareils', statLast: 'dernier envoi',
    inviteTitle: 'Inviter des téléphones', inviteIntro: 'Chaque téléphone qui scanne une invitation reçoit sa propre clé, sans nom ni mot de passe. Vous pourrez le bannir individuellement.',
    inviteName: 'Nom de l’invitation', inviteNamePh: 'Manif du samedi', validFor: 'Valable',
    h6: '6 heures', h24: '24 heures', h48: '48 heures', d7: '7 jours', d30: '30 jours', unlimited: 'sans limite',
    maxPhones: 'Téléphones max', unlimitedPh: 'illimité', quotaGb: 'Quota par téléphone (Go)', serverDefault: 'défaut serveur', createInvite: 'Créer l’invitation',
    scanHint: 'Faites scanner ce QR dans l’application. Code à saisir à la main :', serverFingerprint: 'Empreinte de la clé du serveur :',
    invitations: 'Invitations', colName: 'Nom', colStatus: 'Statut', colUses: 'Utilisations', colExpires: 'Expire', colQuota: 'Quota',
    revoked: 'révoquée', active: 'active', ended: 'terminée', never: 'jamais', revoke: 'Révoquer',
    noInvites: 'Aucune invitation. Créez-en une ci-dessus.',
    revokeInviteConfirm: 'Révoquer cette invitation ? Les téléphones déjà inscrits continueront de fonctionner.',
    devices: 'Appareils',
    devicesIntro: 'Pseudonymes uniquement. La « clé » est celle que la personne voit dans l’app (écran Mon appareil) : elle permet aussi de rendre ses fichiers à la main avec <code>sr decrypt --device</code>. Cliquez sur un nom pour le renommer.',
    colKey: 'Clé', colUsed: 'Utilisé / quota', colObjects: 'Objets', colLast: 'Dernier envoi', colInvitation: 'Invitation',
    banned: 'banni', ban: 'Bannir', unban: 'Débannir', noDevices: 'Aucun appareil inscrit.',
    banConfirm: (n) => `Bannir « ${n} » ? Il ne pourra plus rien envoyer.`, renamePrompt: 'Nouveau nom (visible seulement ici) :',
    handbackTitle: 'Rendre ses fichiers à quelqu’un',
    handbackIntro: 'La personne appuie sur <strong>Récupérer mes fichiers</strong> dans l’app (Réglages) et vous transmet le code affiché, par n’importe quel canal. Sur l’ordinateur qui détient la clé privée : <strong>Rendre ses fichiers</strong> dans l’appli de bureau, ou <code>sr share --code CODE</code> → lien à usage unique (et QR) à lui envoyer par un autre canal. Le serveur ne reçoit que des fichiers rechiffrés avec une clé qu’il ne voit jamais.',
    codeSearchPh: 'Code reçu (ex. K7F3-QX9M)',
    colCode: 'Code', colDevice: 'Appareil', colRequested: 'Demandé', colOnServer: 'Fichiers sur le serveur', colLink: 'Lien',
    stUploading: 'envoi en cours', stReady: 'lien prêt', stOpened: 'ouvert', stDone: 'récupéré', stExpired: 'expiré', stRevoked: 'révoqué',
    waiting: 'en attente', until: 'jusqu’à ', expires: 'expire ', files: (n, s) => `${n} fichier(s), ${s}`, objects: (n, s) => `${n} objets · ${s}`,
    cancelled: 'annulée', unknownCode: 'code inconnu', revokeLink: 'Révoquer le lien', cancel: 'Annuler', noRequests: 'Aucune demande pour l’instant.',
    revokeLinkConfirm: 'Révoquer ce lien ? Il ne fonctionnera plus (rien n’est supprimé : la copie part dans les archives).',
    cancelConfirm: 'Annuler cette demande ? Aucun lien ne pourra être créé avec ce code.',
    journal: 'Journal', uploadsOnly: 'envois uniquement',
    journalIntro: 'Métadonnées des requêtes uniquement (jamais le contenu). Fichiers complets : <code>logs/events-AAAA-MM-JJ.jsonl</code>.',
    colTime: 'Heure', colRequest: 'Requête', colSize: 'Taille', colDetail: 'Détail',
    footer: 'Ce serveur est en écriture seule : aucune page ne permet de lister, télécharger ou supprimer les fichiers reçus (les enregistrements rendus passent dans <code>returned/</code>, jamais supprimés). Le déchiffrement se fait hors ligne avec <code>sr decrypt</code> et la clé privée ; seuls les liens créés par <code>sr share</code> se téléchargent (une fois).',
    chainHead: 'Tête de chaîne du registre :',
    units: ['o', 'Ko', 'Mo', 'Go', 'To'],
  },
};
function t(k, ...a) { const v = STR[LANG][k] ?? STR.en[k] ?? k; return typeof v === 'function' ? v(...a) : v; }
document.documentElement.lang = LANG;
document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
document.querySelectorAll('[data-i18n-html]').forEach((el) => { el.innerHTML = t(el.dataset.i18nHtml); });
document.querySelectorAll('[data-i18n-ph]').forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
// In discreet mode the login page names nothing: no server name, no product name.
const STEALTH = document.body.dataset.stealth === 'true';
const NAME = document.body.dataset.name || '';
document.title = $h1Title();
function $h1Title() { return STEALTH ? t('signIn') : t('adminTitle', NAME); }
document.getElementById('h1').textContent = document.title;
document.getElementById('login-hint').innerHTML = STEALTH ? t('accessKey') : t('tokenHint');

const $ = (id) => document.getElementById(id);
let token = '';
try { token = sessionStorage.getItem('sr-admin') || ''; } catch (_) {}
let deviceNames = {};
const dateLocale = LANG === 'fr' ? 'fr-FR' : undefined;

function esc(v) { return String(v ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtBytes(n) {
  if (n == null) return '–';
  const u = t('units');
  let i = 0; while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return n.toFixed(i ? 1 : 0) + ' ' + u[i];
}
function fmtDate(s) { return s ? new Date(s).toLocaleString(dateLocale) : '–'; }
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' } });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).message || r.statusText);
  return r.json();
}

async function refreshStats() {
  const s = await api('/api/v1/admin/stats');
  if (s.name) { document.title = t('adminTitle', s.name); $('h1').textContent = document.title; }
  $('s-objects').textContent = s.objects;
  $('s-sessions').textContent = s.sessions;
  $('s-bytes').textContent = fmtBytes(s.bytes);
  $('s-free').textContent = fmtBytes(s.free_bytes);
  $('s-last').textContent = s.last_received_at ? new Date(s.last_received_at).toLocaleTimeString(dateLocale) : '–';
  $('chain').textContent = s.chain_head;
  $('pub-url').textContent = s.public_url || '–';
  const tun = s.tunnel || {};
  const tl = { up: [t('tunUp'), 'on'], starting: [t('tunStarting'), 'mid'], down: [t('tunDown'), 'off'] }[tun.state];
  $('tun-state').classList.toggle('hidden', !tl || tun.mode === 'off');
  if (tl) { $('tun-state').textContent = (tun.mode === 'acme' ? 'HTTPS ' : '') + tl[0]; $('tun-state').className = 'pill ' + tl[1]; }
  const note = tun.state === 'down' && tun.error ? tun.error : tun.mode === 'cloudflare' && tun.state === 'up' ? t('tempAddress') : '';
  $('tun-note').textContent = note;
  $('tun-note').classList.toggle('hidden', !note);
  $('state').textContent = s.accepting ? t('accepting') : t('paused');
  $('state').className = 'pill ' + (s.accepting ? 'on' : 'off');
  $('toggle').textContent = s.accepting ? t('pause') : t('resume');
  $('toggle').className = s.accepting ? 'danger' : 'ok';
  $('toggle').onclick = async () => { await api('/api/v1/admin/accepting', { method: 'POST', body: JSON.stringify({ accepting: !s.accepting }) }); refreshStats(); };
}

async function refreshInvites() {
  const { invites, fingerprint } = await api('/api/v1/admin/invites');
  $('fp').textContent = fingerprint;
  $('invites').innerHTML = invites.map((i) => {
    const status = i.revoked ? [t('revoked'), 'off'] : i.active ? [t('active'), 'on'] : [t('ended'), 'mid'];
    return `<tr><td>${esc(i.label)}</td><td><span class="pill ${status[1]}">${status[0]}</span></td>`
      + `<td>${i.uses}${i.max_uses ? ' / ' + i.max_uses : ''}</td><td>${i.expires_at ? fmtDate(i.expires_at) : t('never')}</td>`
      + `<td>${fmtBytes(i.quota_bytes)}</td><td class="row" style="gap:6px">`
      + (i.active ? `<button class="small ghost" data-qr="${i.id}">QR</button><button class="small danger" data-revoke="${i.id}">${t('revoke')}</button>` : '')
      + `</td></tr>`;
  }).join('') || `<tr><td colspan="6" class="muted">${t('noInvites')}</td></tr>`;
  document.querySelectorAll('[data-qr]').forEach((b) => b.onclick = () => showQr(invites.find((i) => i.id === b.dataset.qr)));
  document.querySelectorAll('[data-revoke]').forEach((b) => b.onclick = async () => {
    if (!confirm(t('revokeInviteConfirm'))) return;
    await api(`/api/v1/admin/invites/${b.dataset.revoke}/revoke`, { method: 'POST' });
    $('i-result').classList.add('hidden');
    refreshInvites();
  });
}

async function showQr(inv, svg) {
  if (!svg) svg = (await api('/api/v1/admin/invites/qr?id=' + encodeURIComponent(inv.id))).svg;
  $('i-qr').innerHTML = svg;
  $('i-title').textContent = inv.label;
  $('i-code').textContent = inv.code.replace(/(.{5})/g, '$1 ').trim();
  $('i-link').textContent = inv.link;
  $('i-result').classList.remove('hidden');
  $('i-result').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

$('i-create').onclick = async () => {
  const body = {
    label: $('i-label').value.trim(),
    expires_hours: $('i-exp').value ? Number($('i-exp').value) : null,
    max_uses: $('i-max').value ? Number($('i-max').value) : null,
    quota_gb: $('i-quota').value ? Number($('i-quota').value) : null,
  };
  try {
    const inv = await api('/api/v1/admin/invites', { method: 'POST', body: JSON.stringify(body) });
    await refreshInvites();
    showQr(inv, inv.svg);
  } catch (e) { alert(t('error') + e.message); }
};

async function refreshDevices() {
  const { devices } = await api('/api/v1/admin/devices');
  $('s-devices').textContent = devices.length;
  deviceNames = Object.fromEntries(devices.map((d) => [d.id, d.name]));
  $('devices').innerHTML = devices.map((d) => {
    const pct = d.quota_bytes ? Math.min(100, 100 * d.used_bytes / d.quota_bytes) : 0;
    const key = d.id.slice(0, 16).replace(/(.{4})(?=.)/g, '$1 ');
    return `<tr><td><a class="link" data-rename="${d.id}">${esc(d.name)}</a></td><td><code>${esc(key)}</code></td>`
      + `<td><span class="pill ${d.banned ? 'off' : 'on'}">${d.banned ? t('banned') : t('active')}</span></td>`
      + `<td><div class="bar" title="${pct.toFixed(0)} %"><i style="width:${pct}%"></i></div>${fmtBytes(d.used_bytes)} / ${fmtBytes(d.quota_bytes)}</td>`
      + `<td>${d.objects}</td><td>${fmtDate(d.last_upload_at)}</td><td>${esc(d.invite)}</td>`
      + `<td><button class="small ${d.banned ? 'ok' : 'danger'}" data-ban="${d.id}" data-banned="${d.banned}">${d.banned ? t('unban') : t('ban')}</button></td></tr>`;
  }).join('') || `<tr><td colspan="8" class="muted">${t('noDevices')}</td></tr>`;
  document.querySelectorAll('[data-ban]').forEach((b) => b.onclick = async () => {
    const ban = b.dataset.banned !== 'true';
    if (ban && !confirm(t('banConfirm', deviceNames[b.dataset.ban]))) return;
    await api(`/api/v1/admin/devices/${b.dataset.ban}`, { method: 'POST', body: JSON.stringify({ banned: ban }) });
    refreshDevices();
  });
  document.querySelectorAll('[data-rename]').forEach((a) => a.onclick = async () => {
    const name = prompt(t('renamePrompt'), deviceNames[a.dataset.rename]);
    if (!name) return;
    await api(`/api/v1/admin/devices/${a.dataset.rename}`, { method: 'POST', body: JSON.stringify({ name }) });
    refreshDevices();
  });
}

async function refreshLog() {
  const { events } = await api('/api/v1/admin/events?limit=300');
  const only = $('onlyUploads').checked;
  $('log').innerHTML = events
    .filter((e) => !only || e.method === 'PUT')
    .map((e) => {
      const detail = [e.error, e.index != null ? '#' + e.index : '', e.note].filter(Boolean).join(' ');
      const dev = e.device ? (deviceNames[e.device] || e.device.slice(0, 8)) : '';
      return `<tr><td>${esc(fmtDate(e.ts))}</td><td>${esc(e.ip || '–')}</td>`
        + `<td>${esc(e.method)} ${esc(e.path)}</td><td class="s${String(e.status)[0]}">${e.status || ''}</td>`
        + `<td>${e.bytes != null ? fmtBytes(e.bytes) : ''}</td><td>${esc(dev)}</td><td>${esc(detail)}</td></tr>`;
    }).join('');
}

async function refreshRequests() {
  const { requests, shares } = await api('/api/v1/admin/requests');
  const q = $('r-search').value.replace(/[^a-z0-9]/gi, '').toUpperCase();
  const label = {
    uploading: [t('stUploading'), 'mid'], ready: [t('stReady'), 'on'], opened: [t('stOpened'), 'on'],
    done: [t('stDone'), 'mid'], expired: [t('stExpired'), 'off'], revoked: [t('stRevoked'), 'off'],
  };
  const live = (sh) => sh && ['uploading', 'ready', 'opened'].includes(sh.state);
  const linkCell = (sh) => {
    if (!sh) return `<span class="pill mid">${t('waiting')}</span>`;
    const [txt, c] = label[sh.state] || [sh.state, 'mid'];
    const when = sh.state === 'opened' ? t('until') + fmtDate(sh.window_end)
      : sh.state === 'ready' ? t('expires') + fmtDate(sh.expires_at)
      : sh.closed_at ? fmtDate(sh.closed_at) : '';
    return `<span class="pill ${c}">${txt}</span> <span class="muted">${t('files', sh.files, fmtBytes(sh.bytes))} · ${esc(when)}</span>`;
  };
  const rows = requests.map((r) => ({ ...r, key: r.code.replace(/-/g, '') }))
    .concat(shares.map((sh) => ({ code: '—', key: '', device_name: '', created_at: sh.created_at, share: sh, objects: null })));
  const match = q ? rows.find((r) => r.key === q) : null;
  $('r-found').textContent = q.length >= 8 ? (match ? `→ ${match.device_name || '?'}${match.cancelled ? ' (' + t('cancelled') + ')' : ''}` : t('unknownCode')) : '';
  $('requests').innerHTML = rows.filter((r) => !q || r.key.startsWith(q)).map((r) => {
    const actions = live(r.share)
      ? `<button class="small danger" data-revoke-share="${r.share.id}">${t('revokeLink')}</button>`
      : (r.key && !r.cancelled && !r.share ? `<button class="small ghost" data-cancel="${r.key}">${t('cancel')}</button>` : '');
    return `<tr${match && match === r ? ' style="outline:2px solid var(--ok)"' : ''}><td><span class="code" style="font-size:1rem">${esc(r.code)}</span></td>`
      + `<td>${esc(r.device_name || '')}${r.banned ? ` <span class="pill off">${t('banned')}</span>` : ''}${r.cancelled ? ` <span class="pill off">${t('cancelled')}</span>` : ''}</td>`
      + `<td>${fmtDate(r.created_at)}</td>`
      + `<td>${r.objects == null ? '' : t('objects', r.objects, fmtBytes(r.bytes))}</td>`
      + `<td>${linkCell(r.share)}</td><td>${actions}</td></tr>`;
  }).join('') || `<tr><td colspan="6" class="muted">${t('noRequests')}</td></tr>`;
  document.querySelectorAll('[data-revoke-share]').forEach((b) => b.onclick = async () => {
    if (!confirm(t('revokeLinkConfirm'))) return;
    await api(`/api/v1/admin/shares/${b.dataset.revokeShare}/revoke`, { method: 'POST' });
    refreshRequests();
  });
  document.querySelectorAll('[data-cancel]').forEach((b) => b.onclick = async () => {
    if (!confirm(t('cancelConfirm'))) return;
    await api(`/api/v1/admin/requests/${b.dataset.cancel}/cancel`, { method: 'POST' });
    refreshRequests();
  });
}

async function refreshAll() {
  await Promise.all([refreshStats(), refreshDevices()]);
  await Promise.all([refreshLog(), refreshRequests()]);
}

async function open_() {
  try {
    await refreshAll();
    await refreshInvites();
    try { sessionStorage.setItem('sr-admin', token); } catch (_) {}
    $('login').classList.add('hidden');
    $('panel').classList.remove('hidden');
    $('onlyUploads').onchange = () => refreshLog();
    $('r-search').oninput = () => refreshRequests().catch(() => {});
    setInterval(() => refreshAll().catch(() => {}), 5000);
  } catch (err) {
    $('err').textContent = t('error') + err.message;
  }
}
$('go').onclick = () => { token = $('token').value.trim(); open_(); };
$('token').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('go').click(); });
if (token) open_();
</script>
</body>
</html>
