# nginx in front of a Témoin server (TLS handled here or by another proxy).
# Set SR_TRUST_PROXY=true on the server so the journal keeps the real client IP.
server {
    listen 443 ssl;
    server_name record.example.org;
    # ssl_certificate / ssl_certificate_key …

    client_max_body_size 20m;        # objects are ≤ 16 MiB, hand-back parts ≤ 9 MiB
    proxy_request_buffering off;
    access_log off;                  # the server keeps its own journal

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
