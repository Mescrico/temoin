name: Temoin
options:
  bundleIdPrefix: io.github.temoin-app
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
packages:
  TemoinCore:
    path: TemoinCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.5"
    CURRENT_PROJECT_VERSION: "6"
targets:
  Temoin:
    type: application
    platform: iOS
    sources:
      - path: Temoin
    dependencies:
      - package: TemoinCore
      - target: TemoinWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.temoin-app.temoin
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Témoin
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "Record photos and videos. They are encrypted immediately and cannot be viewed on this phone."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Record sound with videos. It is encrypted immediately."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Optional: add your position inside the encrypted file."
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    info:
      path: Temoin/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: io.github.temoin-app.temoin.enroll
            CFBundleURLSchemes: [srec]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  TemoinWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: TemoinWidgets
      - path: Temoin/Intents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.temoin-app.temoin.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Témoin
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: TemoinWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
