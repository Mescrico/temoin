name: iOS (TestFlight)

# Signed build uploaded to App Store Connect / TestFlight. Signing is managed by Apple
# (cloud signing) through the App Store Connect API key: no certificate in the repo.
on:
  workflow_dispatch:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    # App Store Connect only accepts builds made with the current SDK (Xcode 26 / iOS 26).
    runs-on: macos-26
    if: github.repository == 'temoin-app/temoin'
    defaults:
      run:
        working-directory: ios
    env:
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version
      - name: App Store Connect key, bundle IDs, app record
        id: asc
        run: |
          pip3 install -q --break-system-packages cryptography
          python3 ../tools/appstore.py check
          python3 ../tools/appstore.py ensure-bundle-ids io.github.temoin-app.temoin io.github.temoin-app.temoin.widgets
          python3 ../tools/appstore.py app-exists io.github.temoin-app.temoin
      - name: Generate Xcode project
        run: brew install xcodegen >/dev/null && xcodegen generate
      - name: Archive (signed by Apple cloud signing)
        run: |
          set -o pipefail
          printf '%s' "$APPSTORE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          xcodebuild -project Temoin.xcodeproj -scheme Temoin -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Temoin.xcarchive" \
            DEVELOPMENT_TEAM="${{ steps.asc.outputs.team }}" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            archive | tail -60
      - name: Export and upload to App Store Connect
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ steps.asc.outputs.team }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Temoin.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" | tail -40
      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
