name: App Store Connect setup

# App Store Connect tasks through the API (no build): run from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      task:
        description: What to do
        type: choice
        options: [metadata, screenshots, public-link, internal-testing, submit]
        default: metadata

jobs:
  setup:
    runs-on: ubuntu-latest
    if: github.repository == 'temoin-app/temoin'
    env:
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v5
      - run: pip install -q cryptography
      - name: App Store listing (docs/distribution/appstore.json)
        if: inputs.task == 'metadata'
        run: |
          version=$(sed -n 's/.*MARKETING_VERSION: "\(.*\)"/\1/p' ios/project.yml)
          python3 tools/appstore.py metadata docs/distribution/appstore.json "$version"
      - name: TestFlight public link
        if: inputs.task == 'public-link'
        run: python3 tools/appstore.py public-link io.github.temoin-app.temoin
      - name: TestFlight internal testing (team members, export compliance)
        if: inputs.task == 'internal-testing'
        run: python3 tools/appstore.py internal-testing io.github.temoin-app.temoin
      - name: App Store screenshots (docs/distribution/appstore-screenshots)
        if: inputs.task == 'screenshots'
        run: python3 tools/appstore.py screenshots docs/distribution/appstore-screenshots
      - name: Submit to App Review and TestFlight beta review
        if: inputs.task == 'submit'
        run: |
          version=$(sed -n 's/.*MARKETING_VERSION: "\(.*\)"/\1/p' ios/project.yml)
          python3 tools/appstore.py submit "$version"
