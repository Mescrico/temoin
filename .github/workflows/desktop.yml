name: Desktop (Windows, macOS)

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    branches: [main]
    paths: ['desktop/**', 'server/src/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Fetch cloudflared (official release, signature checked)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/src-tauri/resources | Out-Null
          $out = "desktop/src-tauri/resources/cloudflared.exe"
          Invoke-WebRequest -Uri https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe -OutFile $out
          $sig = Get-AuthenticodeSignature $out
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Cloudflare, Inc\.') { throw "cloudflared signature: $($sig.Status) $($sig.SignerCertificate.Subject)" }
          & $out --version
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2
      - name: Build installer
        working-directory: desktop
        run: cargo tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Temoin-Server-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "Témoin $GITHUB_REF_NAME" --notes "See CHANGELOG.md" || true
          gh release upload "$GITHUB_REF_NAME" desktop/src-tauri/target/release/bundle/nsis/*.exe --clobber

  macos:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Fetch cloudflared (official release, checksums checked, universal)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p desktop/src-tauri/resources cf
          gh api repos/cloudflare/cloudflared/releases/latest > cf/release.json
          tag=$(jq -r .tag_name cf/release.json)
          body=$(jq -r .body cf/release.json)
          for arch in arm64 amd64; do
            f=cloudflared-darwin-$arch.tgz
            curl -fsSL -o "cf/$f" "https://github.com/cloudflare/cloudflared/releases/download/$tag/$f"
            # The archive must match GitHub's recorded digest for that asset...
            asset=$(jq -r --arg f "$f" '.assets[] | select(.name==$f) | .digest' cf/release.json | sed 's/^sha256://')
            got=$(shasum -a 256 "cf/$f" | cut -d' ' -f1)
            echo "$f asset-digest=$asset got=$got"
            test -n "$asset" && test "$asset" = "$got"
            tar -xzf "cf/$f" -C cf && mv cf/cloudflared "cf/cloudflared-$arch"
            # ...and the binary inside must match the checksum in Cloudflare's release notes
            # (for the darwin .tgz entries, the notes give the checksum of the binary).
            want=$(printf '%s\n' "$body" | sed -n "s/^$f: *\([0-9a-f]\{64\}\).*/\1/p" | head -1)
            bin=$(shasum -a 256 "cf/cloudflared-$arch" | cut -d' ' -f1)
            echo "cloudflared-$arch notes=$want got=$bin"
            test -n "$want" && test "$want" = "$bin"
            codesign -dv "cf/cloudflared-$arch" 2>&1 | grep -E "Authority|Identifier" || echo "(not code-signed)"
          done
          lipo -create cf/cloudflared-arm64 cf/cloudflared-amd64 -output desktop/src-tauri/resources/cloudflared
          chmod +x desktop/src-tauri/resources/cloudflared
          lipo -info desktop/src-tauri/resources/cloudflared
          desktop/src-tauri/resources/cloudflared --version
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2
      - name: Import the Developer ID certificate (when configured)
        id: sign
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERT_P12:-}" ]; then
            echo "No Developer ID certificate: ad-hoc signature, not notarized."
            echo "identity=-" >> "$GITHUB_OUTPUT"; echo "notarize=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          kc="$RUNNER_TEMP/build.keychain-db"; kp=$(openssl rand -hex 16)
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kp" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          id=$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          test -n "$id"
          echo "identity=$id" >> "$GITHUB_OUTPUT"; echo "notarize=true" >> "$GITHUB_OUTPUT"
      - name: Build app and disk image (Apple Silicon + Intel)
        working-directory: desktop
        env:
          IDENTITY: ${{ steps.sign.outputs.identity }}
          NOTARIZE: ${{ steps.sign.outputs.notarize }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ "$NOTARIZE" = "true" ]; then
            # Tauri notarizes and staples the app with the App Store Connect API key.
            printf '%s' "$APPSTORE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            export APPLE_API_ISSUER="$APPSTORE_ISSUER_ID" APPLE_API_KEY="$APPSTORE_KEY_ID" APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          fi
          cargo tauri build --target universal-apple-darwin \
            --config "{\"bundle\":{\"macOS\":{\"signingIdentity\":\"$IDENTITY\"}}}"
          rm -f "$RUNNER_TEMP/AuthKey.p8"
      - name: Check the bundle
        env:
          NOTARIZE: ${{ steps.sign.outputs.notarize }}
        run: |
          set -euo pipefail
          app=$(ls -d desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app)
          ls "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -info "$app/Contents/MacOS/"*
          codesign --verify --deep --strict "$app" && echo "signature OK"
          if [ "$NOTARIZE" = "true" ]; then
            xcrun stapler validate "$app"
            spctl --assess --type execute -vv "$app"
          fi
      - name: Smoke test (the app starts and stays up)
        run: |
          set -euo pipefail
          app=$(ls -d desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app)
          export SR_DESKTOP_HOME="$RUNNER_TEMP/temoin-home"
          "$app/Contents/MacOS/temoin-desktop" > "$RUNNER_TEMP/app.log" 2>&1 &
          pid=$!
          sleep 20
          if kill -0 "$pid" 2>/dev/null; then echo "app still running after 20 s"; kill "$pid"; else echo "app exited:"; cat "$RUNNER_TEMP/app.log"; exit 1; fi
          cat "$RUNNER_TEMP/app.log"
      - uses: actions/upload-artifact@v4
        with:
          name: Temoin-Server-macos
          path: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "Témoin $GITHUB_REF_NAME" --notes "See CHANGELOG.md" || true
          gh release upload "$GITHUB_REF_NAME" desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg --clobber
