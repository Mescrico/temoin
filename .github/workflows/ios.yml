name: iOS

on:
  workflow_dispatch:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    branches: [main]
    paths: ['ios/**', 'tools/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - name: Core tests (age sealer, envelope, links)
        working-directory: ios/TemoinCore
        run: SR_INTEROP_DIR=$RUNNER_TEMP/interop swift test
      - name: Interop — decrypt Swift-sealed vectors with the reference age
        run: |
          brew install age >/dev/null
          ../tools/check-vectors.sh $RUNNER_TEMP/interop
          pip3 install -q --break-system-packages pynacl
          python3 ../tools/check-sigs.py $RUNNER_TEMP/interop/sig_ios_*.json
      - name: Generate Xcode project
        run: brew install xcodegen >/dev/null && xcodegen generate
      - name: Build unsigned IPA
        run: |
          xcodebuild -project Temoin.xcodeproj -scheme Temoin -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -40
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Temoin.app Payload/
          zip -qry ../Temoin-unsigned.ipa Payload
          ls -la ../Temoin-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Temoin-ios-unsigned
          path: Temoin-unsigned.ipa

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "Témoin $GITHUB_REF_NAME" --notes "See CHANGELOG.md" || true
          gh release upload "$GITHUB_REF_NAME" Temoin-unsigned.ipa --clobber
